name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src/ tests/ setup.py
          ruff format --check src/ tests/ setup.py
      - name: Test
        run: pytest -q

  morning-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runalyze-morning-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runalyze-morning-sync/package-lock.json
      - name: Install
        run: npm ci
      - name: Build public surface
        run: npm run build:logic
      - name: Test
        run: npm run test:logic

  notion-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notion-trail-goal-training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: notion-trail-goal-training/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
